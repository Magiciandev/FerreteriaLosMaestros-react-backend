spring.application.name=ferreteria-back
server.port=8083

# Base de datos MySQL (se pueden cambiar con variables de entorno).
spring.datasource.url=${TIENDA_DB_URL:jdbc:mysql://localhost:3306/ferreteria_tienda?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${TIENDA_DB_USER:root}
spring.datasource.password=${TIENDA_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT: este servicio solo VALIDA los tokens que emite ferreteria-auth, así que debe usar el mismo
# secreto y el mismo emisor. El valor por defecto es solo para desarrollo: en cualquier otro entorno
# se define JWT_SECRET.
app.jwt.secret=${JWT_SECRET:jWtOGcIBniNbHt7a1WKTfqFuGtq+klVT+zyyy7+apOqE+ijKt8oYS2xQ0azJnMRB}
app.jwt.issuer=ferreteria-auth
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:5173}
